name: Deploy web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Check architecture
        run: pnpm check:architecture
      - name: Check content workflow
        run: pnpm check:content-workflow
      - name: Check presentation assets
        run: pnpm check:presentation-assets
      - name: Run unit tests
        run: pnpm test
      - name: Build GitHub Pages artifact
        run: pnpm build:pages
      - name: Install Chromium
        run: pnpm --filter @guildmaster/web exec playwright install --with-deps chromium
      - name: Verify GitHub Pages path and mobile layouts
        run: pnpm --filter @guildmaster/web exec playwright test -c playwright.pages.config.ts
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web/dist
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v5
